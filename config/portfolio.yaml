    reason: "博弈大盘反转及牛市旗手属性"

  - name: "南方纳指A"
    symbol: "016452"          # 必须是6位纯数字
    type: "otc_fund"          # [新增] 必须指定为场外基金，以便系统路由
    cost: 2.0200               # 您的持仓成本净值
    shares: 118.81              # 您的持有份额
